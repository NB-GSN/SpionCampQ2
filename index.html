<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpionCamp: Tatort Schulnetz</title>
<style>
:root{
  --ink:#2f3437; --ink2:#5b6366; --bg:#f3f1ec; --card:#ffffff; --line:#d6d2c9;
  --petrol:#1f6f78; --petrol-d:#164f56; --petrol-l:#e3f0f1;
  --ok:#2e7d4f; --ok-l:#e5f3ea; --err:#b3402f; --err-l:#f9e6e2; --warn:#b7791f; --warn-l:#fdf5e4;
  --term:#1c2224; --term-ink:#d7e4e2;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Tahoma,sans-serif;font-size:17px;line-height:1.45}
header{background:var(--ink);color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-family:Georgia,serif;font-weight:normal;font-size:20px;margin:0;flex:1;min-width:180px;cursor:pointer}
header .pill{background:rgba(255,255,255,.12);border-radius:999px;padding:3px 12px;font-size:14px;white-space:nowrap}
main{max-width:980px;margin:0 auto;padding:18px 16px 60px}
h2{font-family:Georgia,serif;font-weight:normal;color:var(--petrol-d);font-size:26px;margin:4px 0 10px}
h3{margin:0 0 8px;font-size:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
.story{border-left:5px solid var(--petrol);background:var(--petrol-l)}
.clue{border-left:5px solid var(--warn);background:var(--warn-l)}
.btn{font:inherit;border:0;border-radius:8px;padding:9px 18px;background:var(--petrol);color:#fff;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{background:var(--petrol-d)}
.btn.sec{background:#fff;color:var(--petrol-d);border:1px solid var(--petrol)}
.btn.small{padding:5px 12px;font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tag{font-size:13px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
.small{font-size:14px;color:var(--ink2)}
.missions{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.ms{border:1px solid var(--line);border-radius:10px;padding:14px;background:#fff;cursor:pointer;text-align:left;font:inherit;color:inherit}
.ms:hover{border-color:var(--petrol)}
.ms.done{border-color:var(--ok);background:var(--ok-l)}
.ms.locked{opacity:.5;cursor:default}
.ms .n{font-family:Georgia,serif;font-size:28px;color:var(--petrol)}
.ms .t{font-weight:bold}
ol.tasks{padding-left:22px;margin:6px 0}
ol.tasks li{margin:8px 0}
.evidence{background:var(--term);color:var(--term-ink);font-family:Consolas,"Courier New",monospace;font-size:16px;border-radius:8px;padding:12px 14px;white-space:pre-wrap;word-break:break-word;margin:8px 0}
.evidence .sys{color:#7f9a97}
input[type=text],select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=text]{min-width:0;flex:1}
textarea{width:100%;font-family:Consolas,"Courier New",monospace;font-size:15px}
.fb{border-radius:8px;padding:10px 14px;margin-top:10px}
.fb.ok{background:var(--ok-l);border:1px solid var(--ok)}
.fb.err{background:var(--err-l);border:1px solid var(--err)}
details{margin:8px 0}
details summary{cursor:pointer;color:var(--petrol-d)}
details .inner{padding:8px 12px;border-left:3px solid var(--petrol-l);margin-top:6px}
code,.mono{font-family:Consolas,"Courier New",monospace;font-size:.92em}
pre{background:#f6f5f1;border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.bars{display:flex;align-items:flex-end;gap:2px;height:160px;border-bottom:1px solid var(--ink2);margin-top:10px}
.bars div{flex:1;background:var(--petrol);position:relative;min-width:6px}
.bars div.max{background:var(--warn)}
.blab{display:flex;gap:2px;font-family:Consolas,monospace;font-size:12px}
.blab span{flex:1;text-align:center;min-width:6px}
.scroll{overflow-x:auto}
table.vq{border-collapse:collapse;font-family:Consolas,"Courier New",monospace;font-size:12px}
table.vq td,table.vq th{border:1px solid #e5e2da;width:20px;height:20px;text-align:center;padding:0}
table.vq th{background:var(--petrol-l)}
table.vq td.hl{background:#ffe9b8}
.swatch{width:64px;height:64px;border-radius:50%;border:2px solid rgba(0,0,0,.2);display:inline-block}
.swrow{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;text-align:center;font-size:14px}
.swrow > div{width:110px}
.pal{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
.pal button{width:30px;height:30px;border-radius:50%;border:2px solid #fff;outline:1px solid var(--line);cursor:pointer}
.pal button.sel{outline:3px solid var(--ink)}
.mail{border:1px solid var(--line);border-radius:8px;padding:12px;background:#fff;margin:8px 0}
.mail .hd{font-size:14px;color:var(--ink2);border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:6px}
.certbox{border:1px solid var(--line);border-radius:8px;padding:10px;background:#fafaf7;font-size:14px}
.certbox table{border-collapse:collapse;width:100%}
.certbox td{padding:3px 6px;vertical-align:top;border-bottom:1px solid #eee}
.certbox td:first-child{color:var(--ink2);width:42%}
.opt{display:block;width:100%;text-align:left;font:inherit;background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0;cursor:pointer;color:var(--ink)}
.opt:hover{border-color:var(--petrol)}
.opt.good{border-color:var(--ok);background:var(--ok-l)}
.opt.bad{border-color:var(--err);background:var(--err-l)}
.step{display:flex;gap:10px;align-items:center}
.step .num{font-family:Georgia,serif;color:var(--petrol);width:26px;flex:none;font-size:20px}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.cert{text-align:center}
.cert .big{font-family:Georgia,serif;font-size:40px;letter-spacing:.2em;color:var(--petrol-d)}
.notes li{margin:6px 0}
</style>
</head>
<body>
<header>
  <h1 id="home">SpionCamp: Tatort Schulnetz</h1>
  <span class="pill" id="hTeam"></span>
  <span class="pill" id="hProg"></span>
</header>
<main id="app"></main>

<script>
"use strict";
/* ================= Zustand ================= */
const KEY = "spioncamp-tatort-schulnetz-v1";
let S = load() || fresh();
function fresh(){ return {team:"", solved:{}, extra:{}, quiz:null, quizDone:false}; }
function load(){ try{ const t = localStorage.getItem(KEY); return t ? JSON.parse(t) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const TEACHER = location.hash === "#lehrkraft";

const app = document.getElementById("app");
const $ = (h) => { const d = document.createElement("div"); d.innerHTML = h.trim(); return d.firstElementChild; };
const norm = (s) => String(s).toUpperCase().replace(/Ä/g,"AE").replace(/Ö/g,"OE").replace(/Ü/g,"UE").replace(/ß/g,"SS").replace(/[^A-Z0-9]/g,"");
function shakeEl(el){ el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function caesar(t,k){ return t.replace(/[A-Z]/g, c => String.fromCharCode((c.charCodeAt(0)-65+k+26)%26+65)); }
function code(team,pts){ const t=(team||"").trim().toLowerCase()+"|"+pts+"|NB-spion"; let h=5381; for(const c of t) h=((h*33)^c.charCodeAt(0))>>>0; const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let r=""; for(let i=0;i<5;i++){ r+=A[h%32]; h=Math.floor(h/32); } return r; }

/* ================= Beweismittel ================= */
const N1 = "ZODQ SDVVZRUW JHIXQGHQ";
const N2 = "HT MYLPAHN ZALSSLU DPY PT SLOYLYGPTTLY LPU LPNLULZ DSHU TPA KLT UHTLU ZJOBSL NHZA HBM";
const N2X = "EXAKDKTXYMX DEBVDXG CXWX SXKMBYBDTMLPTKGNGZ PXZ";
const N3 = "FYDPCP NLPDLC YLNSCTNSEPY DTYO KF FYDTNSPC HPYY OTP DNSFWP OTP WZROLEPTPY OPD DPCGPCD WTPDE VLYY DTP UPOP YLNSCTNSE TY HPYTRPY XTYFEPY PYEDNSWFPDDPWY OPDSLWM HPNSDPWY HTC LM DZQZCE KF GTRPYPCP OPY RPSPTXPY DNSWFPDDPW DPYOP TNS OTC SPFEP LMPYO APC XLTW WZPDNSP OTP XLTW DZQZCE YLNS OPX WPDPY";
const N4 = "WOFLGYVG JHVKRZ CLX FEZCGI";

/* ================= Missionen ================= */
const M = [
 {n:1, name:"Die abgefangene Nachricht", topic:"Fachbegriffe, Caesar von Hand, Kerckhoffs",
  story:`Montag, 7:40 Uhr. Der Störfall im Schulnetz letzte Woche war kein Zufall. Die Schulleitung hat in den Protokollen des Notenservers Anmeldungen vom Wochenende gefunden, mit den Konten von drei Lehrkräften. Keine der drei war am Wochenende online.<br><br>Euer Kurs wird zum Forensik-Team. Ihr sollt herausfinden, <b>wer es war</b>, <b>wie es passiert ist</b> und <b>wie die Schule es künftig besser macht</b>.<br><br>In der Firewall findet ihr eine kurze Chatnachricht, die am Donnerstag aus dem Gast-WLAN verschickt wurde. Sie ist verschlüsselt, wahrscheinlich mit einem ganz einfachen Verfahren.`,
  evidence:`<span class="sys">[Firewall] Do 16:42  Gast-WLAN  ->  extern  Chat:</span>\n${N1}`,
  tasks:[
   "Klärt die Fachbegriffe <b>Klartext, Geheimtext, Schlüssel, Verschlüsseln, Entschlüsseln</b> und ordnet sie dem Beweisstück zu (AB 4, Aufgabe 1).",
   "Entschlüsselt die Nachricht mit der Chiffrierscheibe. Probiert verschiedene Verschiebungen aus. Tipp: Das erste Wort hat nur vier Buchstaben.",
   "Notiert: Mit welchem Schlüssel wurde verschlüsselt? Wie seid ihr darauf gekommen?",
   "Die Täter dachten: \"Niemand weiß, wie wir verschlüsseln.\" Erklärt mit dem Prinzip von Kerckhoffs, warum das kein Schutz ist."],
  ask:"Wie lautet die Nachricht im Klartext?", check: a => norm(a)==="WLANPASSWORTGEFUNDEN",
  clue:"Die Täter kannten das WLAN-Passwort der Schule. Es hing auf einem Klebezettel am Bildschirm im Lehrerzimmer.",
  hints:["Außen auf der Scheibe steht der Klartext, innen der Geheimtext. Sucht den Geheimtext-Buchstaben innen und lest außen ab.",
         "Ein Wort mit vier Buchstaben, das zu einem Schulnetz passt … und das mit einem W beginnt.",
         "Der Schlüssel ist 3: Z wird zu W, O wird zu L."],
  tool:"scheibe"},
 {n:2, name:"Das Java-Labor", topic:"Caesar in Java programmieren (BlueJ)",
  story:`Die Spurensicherung hat im Chatprotokoll vom Freitag eine längere Nachricht gefunden. Von Hand dauert das zu lange, und es kommen noch mehr Nachrichten. Ihr baut euch deshalb ein eigenes Werkzeug: ein Java-Programm, das Caesar ver- und entschlüsselt.<br><br>Auf einem Notizzettel im Papierkorb des Lehrerzimmers stand: <b>k = 7</b>.`,
  evidence:`<span class="sys">[Chatprotokoll] Fr 11:58  Gast-WLAN  ->  extern:</span>\n${N2}`,
  tasks:[
   "Ladet das BlueJ-Projekt herunter (Knopf unten) und öffnet es in BlueJ: <b>Projekt → ZIP/JAR öffnen …</b> oder die ZIP-Datei entpacken und <code>package.bluej</code> doppelklicken.",
   "<b>Stufe Basis:</b> Vervollständigt <code>verschluesseln(char c, int k)</code> in der Klasse <code>Caesar</code>. Prüfen: Rechtsklick auf <code>Pruefstand</code> → <code>pruefeBasis()</code>.",
   "<b>Stufe Standard:</b> Schreibt <code>verschluesselnText(String text, int k)</code>. Prüfen mit <code>pruefeStandard()</code>.",
   "<b>Stufe Experte:</b> <code>entschluesselnText</code>, <code>bruteForce</code> und <code>zaehleBuchstaben</code>. Prüfen mit <code>pruefeExperte()</code>.",
   "Entschlüsselt mit eurem Programm die Nachricht vom Freitag (in der Klasse <code>Beweismittel</code> als <code>NACHRICHT_2</code>). Tipp für alle ohne entschluesselnText: Verschlüsseln mit 26 − 7 = 19 macht die Verschiebung rückgängig.",
   "<b>Für alle, im Heft:</b> Erklärt in zwei bis drei Sätzen, was euer Code tut und warum <code>% 26</code> nötig ist."],
  ask:"Unter welchem Namen haben die Täter ihr eigenes WLAN aufgebaut?", check: a => norm(a).includes("SCHULEGAST"),
  clue:"Am Freitag haben die Täter im Lehrerzimmer ein eigenes WLAN mit dem Namen SCHULE GAST aufgebaut. Es sieht aus wie das echte Gast-WLAN.",
  extra:{ask:"Expertenspur: Was steht in NACHRICHT_2_EXPERTE? (Schlüssel unbekannt, nutzt bruteForce)", check:a=>norm(a)==="LEHRKRAEFTEKLICKENJEDEZERTIFIKATSWARNUNGWEG",
         clue:"Expertenspur: Die Täter verlassen sich darauf, dass Lehrkräfte Zertifikatswarnungen im Browser einfach wegklicken."},
  hints:["Basis: <code>nummer + k</code> kann größer als 25 werden. Der Rest beim Teilen durch 26 (<code>% 26</code>) bringt die Zahl wieder in den Bereich 0 bis 25.",
         `Standard: So kann das Gerüst aussehen:<pre>String ergebnis = "";
for (int i = 0; i &lt; text.length(); i++) {
    char zeichen = text.charAt(i);
    if (zeichen &gt;= 'A' &amp;&amp; zeichen &lt;= 'Z') {
        ergebnis = ergebnis + ...;
    } else {
        ergebnis = ergebnis + ...;
    }
}
return ergebnis;</pre>`,
         "Experte: Entschlüsseln mit k ist dasselbe wie Verschlüsseln mit 26 − k. bruteForce ruft entschluesselnText in einer Schleife für k = 1 bis 25 auf."],
  tool:"bluej"},
 {n:3, name:"Angriff auf Caesar", topic:"Brute Force, Häufigkeitsanalyse, Vigenère",
  story:`Am Samstag schicken die Täter eine lange Nachricht, und diesmal fehlt der Notizzettel. Der Schlüssel ist unbekannt. Zeit für einen echten Angriff: Ihr knackt Caesar auf zwei Arten und vergleicht, welche schneller ist.`,
  evidence:`<span class="sys">[Chatprotokoll] Sa 20:14  extern  ->  extern (über Schulserver):</span>\n${N3}`,
  tasks:[
   "<b>Brute Force:</b> Wie viele Schlüssel müsst ihr bei Caesar höchstens ausprobieren? Wer bruteForce programmiert hat, lässt es laufen (<code>Beweismittel.NACHRICHT_3</code>). Alle anderen probieren die ersten beiden Wörter mit der Chiffrierscheibe aus Mission 1 (AB 4, Aufgabe 2).",
   "<b>Häufigkeitsanalyse:</b> Zählt mit dem Häufigkeitszähler unten, welcher Buchstabe am häufigsten vorkommt. Im Deutschen ist das fast immer E. Berechnet daraus den Schlüssel (AB 4, Aufgabe 3). Experten nutzen ihre Methode <code>zaehleBuchstaben</code>.",
   "Entschlüsselt die Nachricht. Wovor haben die Täter Angst, und was machen sie jetzt anders?",
   "Vigenère: Verschlüsselt ANANAS mit dem Schlüssel KEY von Hand und erklärt, warum die Häufigkeitsanalyse jetzt nicht mehr so einfach klappt (AB 4, Aufgabe 6)."],
  ask:"Mit welchem Schlüssel k wurde die Nachricht vom Samstag verschlüsselt?", check: a => norm(a)==="11" || norm(a)==="K11",
  clue:"Die Täter wechseln auf das Vigenère-Verfahren. Den Schlüssel wollen sie sich per Mail schicken.",
  hints:["Im Geheimtext ist P am häufigsten. Wenn P für E steht: Wie weit ist es von E bis P?",
         "E ist der 5. Buchstabe (Nummer 4), P der 16. (Nummer 15). 15 − 4 = …"],
  tool:"haeufigkeit"},
 {n:4, name:"Das Schlüsselproblem", topic:"Schlüsselaustausch, Anzahl Schlüssel, Farbmisch-Experiment",
  story:`Im Protokoll des Mailservers findet ihr eine Mail vom Samstagabend. Sie ist <b>nicht verschlüsselt</b>. Darin steht nur ein Wort: der Vigenère-Schlüssel. Kurz danach wird eine neue Nachricht abgefangen.<br><br>Damit habt ihr gezeigt, wo das Problem jedes symmetrischen Verfahrens liegt: Der Schlüssel muss irgendwie zum Empfänger.`,
  evidence:`<span class="sys">[Mailserver] Sa 21:02  Betreff: (leer)  unverschlüsselt</span>\nROUTER\n\n<span class="sys">[Chatprotokoll] Sa 21:30  Vigenère:</span>\n${N4}`,
  tasks:[
   "Entschlüsselt die Vigenère-Nachricht mit dem Schlüssel ROUTER und dem Vigenère-Quadrat. Leerzeichen zählen nicht mit, der Schlüssel läuft nur über die Buchstaben.",
   "Erklärt, warum die unverschlüsselte Mail der entscheidende Fehler der Täter war. Formuliert das Schlüsselaustauschproblem allgemein.",
   "Unser Kurs hat 20 Personen. Jede soll mit jeder geheim schreiben können. Wie viele symmetrische Schlüssel braucht ihr? Begründet die Formel n · (n − 1) / 2 (AB 4, Aufgabe 7 und AB 5, Aufgabe 1).",
   "Farbmisch-Experiment: Wie hätten die Täter einen gemeinsamen Schlüssel vereinbaren können, ohne dass wir ihn im Protokoll sehen? Probiert es unten aus und erklärt, warum Eve die gemeinsame Farbe nicht herstellen kann (AB 5, Aufgabe 4)."],
  ask:"Wie lautet die Vigenère-Nachricht im Klartext?", check: a => norm(a)==="FALSCHESPORTALISTONLINE",
  clue:"Die Täter betreiben ein gefälschtes Anmeldeportal, das wie das Notenportal der Schule aussieht.",
  hints:["Erster Buchstabe: W mit Schlüsselbuchstabe R. Sucht in der Zeile R den Buchstaben W. Die Spalte darüber ist der Klartext.",
         "Die ersten beiden Buchstaben sind F und A."],
  tool:"vigenere"},
 {n:5, name:"Echt oder gefälscht?", topic:"Schlüsselpaar, Signatur, Man-in-the-Middle, Zertifikate",
  story:`Am Freitag um 15:10 Uhr bekamen alle Lehrkräfte zwei Mails, beide angeblich von der Schulleitung. Eine davon führt zum gefälschten Portal. Wer im WLAN SCHULE GAST war, bekam beim Öffnen des Portals außerdem eine Zertifikatswarnung, die viele weggeklickt haben.<br><br>Prüft die Signaturen und die Zertifikate wie ein Browser.`,
  evidence:null,
  tasks:[
   "Erklärt das Prinzip des Schlüsselpaars mit dem Bild von Schloss und Schlüssel (AB 5, Aufgabe 2).",
   "Füllt die Merktabelle aus: Wer nutzt welchen Schlüssel beim Verschlüsseln und beim Signieren? (AB 5, Aufgabe 3)",
   "Prüft unten die Signaturen der beiden Mails. Welchen Schlüssel braucht ihr dafür?",
   "Vergleicht die beiden Zertifikate. Erklärt, wie der Man-in-the-Middle-Angriff im WLAN SCHULE GAST funktioniert hat und warum ein Zertifikat ihn verhindert hätte (AB 5, Aufgabe 5)."],
  ask:"Wer hat das gefälschte Zertifikat ausgestellt? (Feld „Ausgestellt von“)", check: a => norm(a).includes("BRANDT"),
  clue:"Das gefälschte Portal nutzt ein selbst signiertes Zertifikat. Ausgestellt von: K. Brandt IT-Service.",
  hints:["Eine Signatur prüft man mit dem öffentlichen Schlüssel des Absenders, also der Schulleitung.",
         "Ein Zertifikat ist nur vertrauenswürdig, wenn eine Zertifizierungsstelle es unterschrieben hat, die der Browser kennt. Steht bei „Ausgestellt von“ dasselbe wie bei „Ausgestellt für“, hat sich jemand selbst unterschrieben."],
  tool:"signatur"},
 {n:6, name:"Finale: Wer war es?", topic:"Angriff rekonstruieren, hybride Verfahren, Sicherheitskonzept",
  story:`Ihr habt alle Spuren zusammen. Jetzt rekonstruiert ihr den Angriff, überführt den Täter und schreibt für die Schulleitung ein Sicherheitskonzept: Wie macht die Schule es künftig besser?`,
  evidence:`<span class="sys">[Besucherliste Sekretariat] Freitag</span>\n 9:00-12:00  Fortbildung: Referentin Dr. S. Lenz (Lehrerzimmer)\n10:15-11:00  PrintPro, Wartung Kopierer (Raum 104)\n14:30-15:20  K. Brandt IT-Service, "Abholung Altgeräte" (Lehrerzimmer)\n<span class="sys">Hinweis Schulträger: Der Vertrag mit K. Brandt IT-Service endete im Juli. Eine Abholung war nicht beauftragt.</span>`,
  tasks:[
   "Bringt die Schritte des Angriffs in die richtige Reihenfolge (unten).",
   "Wer war es? Begründet eure Entscheidung mit mindestens zwei Spuren aus der Fallakte.",
   "Erklärt, wie HTTPS symmetrische und asymmetrische Verfahren kombiniert und warum (AB 6, Aufgabe 1 und 2).",
   "<b>Sicherheitskonzept für die Schulleitung</b> (Plakat oder Heft): Mindestens fünf Maßnahmen. Zu jeder Maßnahme: Welchen Schritt des Angriffs hätte sie verhindert, und welches Verfahren steckt dahinter? Unterscheidet auch Transport- und Ende-zu-Ende-Verschlüsselung (AB 6, Aufgabe 4).",
   "Zum Schluss: Abschlussquiz für die Rangliste."],
  ask:null, clue:"Täter überführt: K. Brandt IT-Service, der ehemalige externe Dienstleister der Schule.",
  hints:["Achtet auf die Spur aus Mission 5 und auf die Besucherliste: Wer war am Freitag zur richtigen Zeit im Lehrerzimmer?"],
  tool:"finale"}
];

/* ================= Navigation ================= */
function unlocked(n){ return TEACHER || n===1 || !!S.solved[n-1]; }
function header(){
  const ht = document.getElementById("hTeam"); ht.textContent = S.team ? "Team: "+S.team : ""; ht.style.display = S.team ? "" : "none";
  const d = Object.keys(S.solved).length;
  document.getElementById("hProg").textContent = d+" von 6 Missionen gelöst" + (TEACHER?" · Lehrkraft":"");
}
document.getElementById("home").onclick = () => { location.hash = TEACHER ? "#lehrkraft" : ""; home(); };

function home(){
  header(); app.innerHTML = ""; window.scrollTo(0,0);
  app.append($(`<div class="card story"><span class="tag">Fallakte</span><h2>Tatort Schulnetz</h2>
    <p>Jemand hat sich Zugang zum Notenserver der Schule verschafft. Euer Kurs ist das Forensik-Team. Ihr arbeitet euch durch sechs Missionen, entschlüsselt abgefangene Nachrichten und baut Schritt für Schritt das Wissen auf, mit dem ihr den Täter überführt.</p>
    <p><b>Am Ende steht euer Sicherheitskonzept für die Schulleitung.</b></p>
    <div class="row"><input type="text" id="team" placeholder="Name eures Teams" value="${S.team.replace(/"/g,"&quot;")}" maxlength="40"><button class="btn" id="saveTeam">Speichern</button></div>
    <p class="small">Euer Fortschritt wird nur in diesem Browser gespeichert. Jede Mission öffnet sich, wenn die vorherige gelöst ist.</p></div>`));
  app.querySelector("#saveTeam").onclick = () => { S.team = app.querySelector("#team").value.trim(); save(); header(); };
  const grid = $(`<div class="missions"></div>`);
  for(const m of M){
    const done = !!S.solved[m.n], open = unlocked(m.n);
    const b = $(`<button class="ms ${done?"done":""} ${open?"":"locked"}"><div class="n">${m.n}</div><div class="t">${m.name}</div><div class="small">${m.topic}</div><div class="small" style="margin-top:6px">${done?"✓ gelöst":open?"offen":"gesperrt"}</div></button>`);
    if(open) b.onclick = () => mission(m.n);
    grid.append(b);
  }
  app.append(grid);
  const notes = M.filter(m => S.solved[m.n]).map(m => `<li>${m.clue}</li>`).concat(M.filter(m=>m.extra && S.extra[m.n]).map(m=>`<li>${m.extra.clue}</li>`));
  app.append($(`<div class="card clue" style="margin-top:16px"><h3>Ermittlungsnotizen</h3>${notes.length?`<ul class="notes">${notes.join("")}</ul>`:`<p class="small">Noch keine Spuren. Startet mit Mission 1.</p>`}</div>`));
  if(TEACHER) app.append($(`<div class="card"><h3>Lehrkraft</h3><p class="small">Im Modus #lehrkraft sind alle Missionen offen. Prüfcodes der Rangliste kontrollieren: Teamname und Punkte eingeben.</p><div class="row"><input type="text" id="tn" placeholder="Teamname"><input type="text" id="tp" placeholder="Punkte" style="max-width:100px"><button class="btn" id="tc">Code anzeigen</button><span id="tr" class="mono"></span></div></div>`));
  if(TEACHER) app.querySelector("#tc").onclick = () => { app.querySelector("#tr").textContent = code(app.querySelector("#tn").value, parseInt(app.querySelector("#tp").value,10)||0); };
}

function mission(n){
  const m = M[n-1]; header(); app.innerHTML = ""; window.scrollTo(0,0);
  app.append($(`<div class="card story"><span class="tag">Mission ${n} von 6 · ${m.topic}</span><h2>${m.name}</h2><p>${m.story}</p>${m.evidence?`<div class="evidence">${m.evidence}</div>`:""}</div>`));
  app.append($(`<div class="card"><h3>Euer Auftrag</h3><ol class="tasks">${m.tasks.map(t=>`<li>${t}</li>`).join("")}</ol></div>`));
  const tool = $(`<div class="card"></div>`); app.append(tool); TOOLS[m.tool](tool);
  if(m.hints.length) app.append($(`<div class="card"><h3>Hilfekarten</h3>${m.hints.map((h,i)=>`<details><summary>Hilfe ${i+1}</summary><div class="inner">${h}</div></details>`).join("")}</div>`));
  if(m.ask) app.append(answerBox(m.ask, m.check, () => { S.solved[n] = true; save(); }, S.solved[n], m.clue));
  if(m.extra) app.append(answerBox(m.extra.ask, m.extra.check, () => { S.extra[n] = true; save(); }, S.extra[n], m.extra.clue));
  const nav = $(`<div class="row"><button class="btn sec" id="back">Zur Fallakte</button>${n<6?`<button class="btn" id="next">Zu Mission ${n+1}</button>`:""}</div>`);
  nav.querySelector("#back").onclick = home;
  if(n<6) nav.querySelector("#next").onclick = () => { if(unlocked(n+1)) mission(n+1); else shakeEl(nav.querySelector("#next")); };
  app.append(nav);
}

function answerBox(ask, check, onOk, done, clue){
  const c = $(`<div class="card clue"><h3>Ermittlungsergebnis</h3><p>${ask}</p><div class="row"><input type="text" placeholder="Antwort"><button class="btn">Prüfen</button></div><div class="out"></div></div>`);
  const inp = c.querySelector("input"), out = c.querySelector(".out");
  const show = () => { out.innerHTML = `<div class="fb ok"><b>Richtig. Neue Spur:</b> ${clue}</div>`; };
  if(done) show();
  const go = () => { if(check(inp.value)){ onOk(); show(); header(); } else { out.innerHTML = `<div class="fb err">Das passt noch nicht. Prüft eure Lösung oder nutzt eine Hilfekarte.</div>`; shakeEl(c); } };
  c.querySelector("button").onclick = go; inp.onkeydown = e => { if(e.key==="Enter") go(); };
  return c;
}

function quiz(el){
  if(!S.solved[6]){ el.innerHTML = `<p class="small">Das Quiz öffnet sich, wenn ihr den Täter überführt habt.</p>`; return; }
  if(S.quizDone) return certificate(el);
  if(!S.quiz) { S.quiz = {i:0, pts:0, order: shuffle(Q.map((_,i)=>i)), tries:0}; save(); }
  const z = S.quiz; if(z.i >= Q.length){ S.quizDone = true; save(); return certificate(el); }
  const [q, opts] = Q[z.order[z.i]];
  el.innerHTML = `<p class="small">Frage ${z.i+1} von ${Q.length} · bisher ${z.pts} Punkte · richtig im ersten Versuch: 2 Punkte, im zweiten: 1 Punkt</p><p><b>${q}</b></p><div class="o"></div>`;
  const od = el.querySelector(".o");
  shuffle(opts.map((t,i)=>[t,i])).forEach(([t,i]) => { const b = $(`<button class="opt">${t}</button>`); b.onclick = () => {
    if(b.classList.contains("bad")) return;
    if(i===0){ z.pts += z.tries===0 ? 2 : z.tries===1 ? 1 : 0; z.tries = 0; z.i++; b.classList.add("good"); save(); setTimeout(()=>quiz(el), 600); }
    else { z.tries++; b.classList.add("bad"); save(); }
  }; od.append(b); });
}
function certificate(el){
  const p = S.quiz ? S.quiz.pts : 0;
  el.innerHTML = `<div class="cert card"><span class="tag">Fall abgeschlossen</span><h2>Team ${S.team || "(ohne Namen)"}</h2><div class="big">${p} / 20</div><p>Quizpunkte für die Rangliste</p><p>Prüfcode: <b class="mono">${code(S.team, p)}</b></p><p class="small">Zeigt diese Seite eurer Lehrkraft. Gebt danach euer Sicherheitskonzept ab.</p></div>`;
}
