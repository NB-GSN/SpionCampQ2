<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpionCamp: Tatort Schulnetz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0f1416; --night2:#172023; --night3:#1f2b2f; --line-d:#2c3a3e;
  --paper:#f5efe2; --paper2:#ebe3d1; --ink:#2a2824; --ink2:#6a645a; --line:#d9cfba;
  --petrol:#1f7a84; --petrol-d:#155961; --petrol-l:#d9ecec; --cyan:#7fd0d6;
  --amber:#f0b040; --amber-d:#b7791f; --red:#c43a2c; --red-l:#f6dfd9; --ok:#2e7d4f; --ok-l:#dff0e3;
  --mono:"IBM Plex Mono",Consolas,"Courier New",monospace;
  --type:"Special Elite","Courier New",monospace;
  --sans:"IBM Plex Sans","Trebuchet MS",Tahoma,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--night);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;
  background-image:linear-gradient(rgba(127,208,214,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(127,208,214,.035) 1px,transparent 1px),radial-gradient(ellipse at top,#1d2a2e 0%,#0f1416 60%);
  background-size:32px 32px,32px 32px,100% 100%;background-attachment:fixed;min-height:100vh}
header{position:sticky;top:0;z-index:10;background:rgba(15,20,22,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line-d);color:#e7eeec;padding:10px 16px}
.hwrap{max-width:1000px;margin:0 auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.logo{font-family:var(--mono);font-weight:600;letter-spacing:.12em;color:var(--amber);font-size:14px;cursor:pointer;white-space:nowrap}
.logo b{color:#e7eeec;font-family:var(--type);font-weight:normal;letter-spacing:.02em;font-size:20px;margin-left:8px}
.pips{display:flex;gap:6px;flex:1;min-width:120px}
.pip{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-d);font:600 11px var(--mono);display:flex;align-items:center;justify-content:center;color:#7f9a97}
.pip.done{background:var(--petrol);border-color:var(--petrol);color:#fff}
.pip.part{border-color:var(--amber);color:var(--amber)}
.chip{font:13px var(--mono);background:rgba(127,208,214,.1);color:var(--cyan);border-radius:999px;padding:4px 12px;white-space:nowrap}
main{max-width:1000px;margin:0 auto;padding:22px 16px 80px}
h1,h2{font-family:var(--type);font-weight:normal;margin:0 0 10px;line-height:1.2}
h2{font-size:30px;color:var(--ink)}
h3{margin:0 0 8px;font-size:18px}
.dark h2,.dark h3{color:#e7eeec}
.tag{font:600 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.dark .tag{color:var(--amber)}
.small{font-size:14px;color:var(--ink2)}
a{color:var(--petrol-d)}
/* Akten */
.file{position:relative;background:var(--paper);border-radius:4px 10px 10px 10px;padding:22px 22px 20px;margin:28px 0 18px;box-shadow:0 10px 30px rgba(0,0,0,.35);border:1px solid #e2d8c2}
.file::before{content:attr(data-tab);position:absolute;top:-24px;left:-1px;background:var(--paper);border:1px solid #e2d8c2;border-bottom:0;border-radius:8px 8px 0 0;padding:3px 16px 2px;font:600 12px var(--mono);letter-spacing:.12em;color:var(--ink2);text-transform:uppercase}
.file.story{background:linear-gradient(var(--paper),var(--paper2))}
.file.story p{font-size:17.5px}
.dark{background:var(--night2);border:1px solid var(--line-d);color:#cfdcda;border-radius:10px;padding:20px;margin:18px 0;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.stamp{position:absolute;right:18px;top:14px;transform:rotate(6deg);border:4px solid var(--red);color:var(--red);font:bold 18px var(--mono);letter-spacing:.12em;padding:4px 12px;border-radius:6px;opacity:.85;pointer-events:none}
.stamp.ok{border-color:var(--ok);color:var(--ok)}
.evidence{position:relative;background:#0b1012;color:#b9f0c4;font:15.5px/1.55 var(--mono);border-radius:8px;padding:14px 16px;white-space:pre-wrap;word-break:break-word;margin:12px 0 4px;border:1px solid #233;box-shadow:inset 0 0 30px rgba(0,0,0,.6);overflow:hidden}
.evidence::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);pointer-events:none}
.evidence .sys{color:#6f8f8a}
.evidence .hot{color:var(--amber);font-weight:600}
/* Schritte */
.step{background:#fffdf8;border:1px solid var(--line);border-radius:10px;padding:18px;margin:14px 0;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.step.locked{background:rgba(255,253,248,.08);border:1px dashed var(--line-d);color:#7f9a97;box-shadow:none}
.step.solved{border-color:var(--ok)}
.shead{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.snum{flex:none;width:34px;height:34px;border-radius:50%;background:var(--petrol);color:#fff;font:600 15px var(--mono);display:flex;align-items:center;justify-content:center}
.step.solved .snum{background:var(--ok)}
.step.locked .snum{background:var(--night3);color:#7f9a97}
.stitle{font-weight:600;font-size:18px;flex:1}
.btn{font:600 15px var(--sans);border:0;border-radius:8px;padding:9px 18px;background:var(--petrol);color:#fff;cursor:pointer;text-decoration:none;display:inline-block;letter-spacing:.02em}
.btn:hover{background:var(--petrol-d)}
.btn.amber{background:var(--amber);color:#2a2008}
.btn.amber:hover{background:#ffc45a}
.btn.ghost{background:transparent;color:var(--petrol-d);border:1px solid var(--petrol)}
.dark .btn.ghost,header .btn.ghost{color:var(--cyan);border-color:var(--cyan)}
.btn.small{padding:5px 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text],select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=text]{min-width:0}
.grow{flex:1}
textarea{width:100%;font-family:var(--mono);font-size:14px}
.fb{border-radius:8px;padding:10px 14px;margin-top:10px}
.fb.ok{background:var(--ok-l);border:1px solid var(--ok)}
.fb.err{background:var(--red-l);border:1px solid var(--red)}
.fb.info{background:var(--petrol-l);border:1px solid var(--petrol)}
.opt{display:block;width:100%;text-align:left;font:inherit;background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0;cursor:pointer;color:var(--ink)}
.opt:hover{border-color:var(--petrol)}
.opt.good{border-color:var(--ok);background:var(--ok-l)}
.opt.bad{border-color:var(--red);background:var(--red-l)}
.opt .why{display:block;font-size:14px;color:var(--ink2);margin-top:3px}
details.hint{margin:8px 0;border:1px solid #ecd9a8;background:#fff8e6;border-radius:8px;padding:6px 12px}
details.hint summary{cursor:pointer;color:var(--amber-d);font-weight:600}
details.hint[open] summary{margin-bottom:6px}
code,.mono{font-family:var(--mono);font-size:.92em}
pre{background:#f6f3ec;border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;font:14px/1.6 var(--mono)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .35s ease-out}
/* Startseite */
.hero{position:relative;padding:28px 22px}
.hero h1{font-size:46px;color:#f2efe7}
.hero p{color:#cfdcda;max-width:640px}
.missions{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:40px 22px;margin-top:34px}
.mcard{position:relative;text-align:left;font:inherit;color:var(--ink);cursor:pointer;background:var(--paper);border:1px solid #e2d8c2;border-radius:4px 10px 10px 10px;padding:18px 18px 16px;box-shadow:0 8px 22px rgba(0,0,0,.35);transition:transform .15s}
.mcard:hover{transform:translateY(-3px)}
.mcard::before{content:attr(data-tab);position:absolute;top:-22px;left:-1px;background:var(--paper);border:1px solid #e2d8c2;border-bottom:0;border-radius:8px 8px 0 0;padding:2px 14px;font:600 11px var(--mono);letter-spacing:.12em;color:var(--ink2)}
.mcard .t{font-family:var(--type);font-size:22px;margin:2px 0 4px}
.mcard.locked{cursor:default;filter:grayscale(1) brightness(.55)}
.mcard.locked:hover{transform:none}
.mcard .st{font:600 12px var(--mono);letter-spacing:.08em;margin-top:8px;color:var(--ink2);padding-right:96px}
.mcard.done .st{color:var(--ok)}
.notes li{margin:6px 0}
/* Werkbank */
.bench{display:flex;flex-wrap:wrap;gap:16px 22px;margin:12px 0}
.word{display:flex;gap:3px;padding:6px;border-radius:8px;border:2px solid transparent}
.word.ok{border-color:var(--ok);background:var(--ok-l)}
.word.bad{border-color:var(--red);background:var(--red-l)}
.lc{display:flex;flex-direction:column;align-items:center;gap:3px;width:34px}
.lc .key{font:600 12px var(--mono);color:var(--petrol-d);background:var(--petrol-l);border-radius:4px;width:100%;text-align:center;line-height:1.3}
.lc .key small{display:block;font-size:10px;color:var(--ink2)}
.lc .ci{font:600 18px var(--mono);color:var(--red)}
.lc input{width:34px;height:38px;text-align:center;font:600 18px var(--mono);padding:0;text-transform:uppercase;border:1px solid var(--line);border-radius:6px}
.lc input:focus{outline:2px solid var(--amber);border-color:var(--amber)}
.strip{font:600 15px var(--mono);overflow-x:auto;margin:8px 0}
.strip table{border-collapse:collapse}
.strip td{width:24px;text-align:center;padding:2px 0;border:1px solid #e9e2d2}
.strip tr:first-child td{background:var(--petrol-l);color:var(--petrol-d)}
.strip tr:last-child td{color:var(--red)}
.strip th{padding:0 8px;font:600 11px var(--mono);color:var(--ink2);text-align:right;white-space:nowrap}
/* Lückencode */
.code{background:#14201f;color:#d6e7e4;border-radius:8px;padding:12px 14px;font:14.5px/2.1 var(--mono);overflow-x:auto;white-space:pre}
.code .cm{color:#7f9a97}
.code .kw{color:#f2a96b}
.code .st{color:#b9f0c4}
.gap{display:inline-flex;align-items:center;gap:2px;vertical-align:middle}
.gap input{font:600 14px var(--mono);background:#fff8e6;border:2px solid var(--amber);border-radius:5px;padding:1px 5px;color:#2a2008;height:28px}
.gap input.ok{background:var(--ok-l);border-color:var(--ok)}
.gap input.bad{background:var(--red-l);border-color:var(--red)}
.gap .lab{font:600 10px var(--mono);color:var(--amber);margin-right:2px}
.gap button{font:600 12px var(--mono);border:0;background:#3a4a4c;color:#fff;border-radius:4px;width:22px;height:22px;cursor:pointer}
.gaphints .fb{margin-top:6px}
/* Pipeline */
.pipe{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:10px 0}
.pipe .box{background:#fff;border:2px solid var(--petrol);border-radius:8px;padding:6px 10px;text-align:center;min-width:70px}
.pipe .box b{display:block;font:600 22px var(--mono)}
.pipe .box span{font-size:12px;color:var(--ink2)}
.pipe .arr{font:600 13px var(--mono);color:var(--petrol-d);text-align:center}
/* Farben */
.swatch{width:62px;height:62px;border-radius:50%;border:3px solid rgba(0,0,0,.15);display:inline-block;box-shadow:inset 0 -6px 12px rgba(0,0,0,.15)}
.pal{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
.pal button{width:30px;height:30px;border-radius:50%;border:2px solid #fff;outline:1px solid var(--line);cursor:pointer}
.pal button.sel{outline:3px solid var(--ink)}
.dh{display:grid;grid-template-columns:1fr 90px 1fr;gap:8px;align-items:center;text-align:center;margin-top:10px}
.dh .who{font:600 13px var(--mono);letter-spacing:.1em;color:var(--ink2)}
.dh .mid{font-size:13px;color:var(--ink2)}
.dh .cell{min-height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px}
.eve{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:14px}
/* Mails & Zertifikate */
.mail{border:1px solid var(--line);border-radius:8px;padding:12px;background:#fff;margin:8px 0}
.mail .hd{font-size:13px;color:var(--ink2);border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:6px;font-family:var(--mono)}
.certbox{border:1px solid var(--line);border-radius:8px;padding:10px;background:#fbf8f1;font-size:14px}
.certbox table{border-collapse:collapse;width:100%}
.certbox td{padding:4px 6px;vertical-align:top;border-bottom:1px solid #eee5d3}
.certbox td:first-child{color:var(--ink2);width:42%}
.locks{display:flex;gap:18px;flex-wrap:wrap;align-items:center;justify-content:center;margin:8px 0;font-size:14px;text-align:center}
.locks svg{display:block;margin:0 auto 4px}
table.mt{border-collapse:collapse;width:100%;font-size:15px}
table.mt td,table.mt th{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:middle}
table.mt th{background:var(--paper2)}
table.mt select{width:100%}
/* Graph */
.graph{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
/* Bericht */
.report{position:relative;background:var(--paper);border-radius:10px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.report table{border-collapse:collapse;width:100%;font-size:15px;margin:10px 0}
.report td,.report th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
.report th{font:600 12px var(--mono);letter-spacing:.08em;color:var(--ink2);text-transform:uppercase}
.bigcode{font:600 34px var(--mono);letter-spacing:.12em;color:var(--petrol-d);background:#fff;border:2px dashed var(--petrol);border-radius:10px;padding:10px 16px;display:inline-block;margin:6px 0;word-break:break-all}
.tt{overflow-x:auto}
.tt table{border-collapse:collapse;font-size:14px;width:100%;color:#dfe9e7}
.tt td,.tt th{border-bottom:1px solid var(--line-d);padding:6px 8px;text-align:center;white-space:nowrap}
.tt th{font:600 11px var(--mono);letter-spacing:.08em;color:var(--amber)}
.tt td:first-child,.tt th:first-child{text-align:left}
.dark input[type=text]{background:#0f1416;color:#e7eeec;border-color:var(--line-d)}
@media print{header{display:none} body{background:#fff}}
</style>
</head>
<body>
<header><div class="hwrap">
  <span class="logo" id="home">SPIONCAMP<b>Tatort Schulnetz</b></span>
  <div class="pips" id="pips"></div>
  <span class="chip" id="hTeam"></span>
  <button class="btn amber small" id="hSave">📷 Stand sichern</button>
</div></header>
<main id="app"></main>

<script>
"use strict";
/* =====================================================================
   Zustand
   ===================================================================== */
const KEY = "spioncamp-tatort-schulnetz-v2";
const NSTEPS = [3,4,4,3,4,4];        // Schritte pro Mission
const TEACHER = location.hash === "#lehrkraft";
let S = load() || fresh();
function fresh(){ return {team:"", steps:{}, fails:{}, hints:{}, seen:{}, java:{e:false}, extra:false, transfer:false, quiz:null, quizDone:false, quizPts:0, ui:{}}; }
function load(){ try{ const t = localStorage.getItem(KEY); return t ? Object.assign(fresh(), JSON.parse(t)) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const stepDone = (n,i) => !!(S.steps[n] && S.steps[n][i]);
const missionDone = (n) => { for(let i=0;i<NSTEPS[n-1];i++) if(!stepDone(n,i)) return false; return true; };
const missionStarted = (n) => S.steps[n] && S.steps[n].some(Boolean);
const unlocked = (n) => TEACHER || n===1 || missionDone(n-1);
function markStep(n,i){ (S.steps[n] = S.steps[n] || [])[i] = true; save(); pips(); }
function fail(n){ S.fails[n] = (S.fails[n]||0)+1; save(); }
function hintUsed(n,id){ if(S.seen[id]) return; S.seen[id] = true; S.hints[n] = (S.hints[n]||0)+1; save(); }
function missionPts(n){ return missionDone(n) ? Math.max(6, 10 - Math.min(4, S.fails[n]||0)) : 0; }
function totalPts(){ let p = 0; for(let n=1;n<=6;n++) p += missionPts(n); if(S.java.e) p += 4; if(S.extra) p += 2; if(S.transfer) p += 6; return p + (S.quizDone ? S.quizPts : 0); }
const MAXPTS = 6*10 + 4 + 2 + 6 + 20;

/* =====================================================================
   Stand-Code (Teamname + Fortschritt, mit Prüfsumme)
   ===================================================================== */
const A32 = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function teamKey(t){ return String(t||"").trim().toLowerCase().replace(/\s+/g," "); }
function hash(str){ let h = 2166136261>>>0; for(const c of str){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619)>>>0; } return h; }
function packState(st){
  let v = 0n, bits = 0;
  const put = (x,b) => { v = (v<<BigInt(b)) | BigInt(Math.max(0,Math.min((1<<b)-1, x|0))); bits += b; };
  for(let n=1;n<=6;n++){ let m=0; for(let i=0;i<4;i++) if(st.steps[n] && st.steps[n][i]) m |= (1<<i); put(m,4); put(st.fails[n]||0,3); put(st.hints[n]||0,2); }
  put(st.java.e?1:0,1); put(st.extra?1:0,1); put(st.transfer?1:0,1); put(st.quizDone?1:0,1); put(st.quizPts||0,5);
  return [v,bits];
}
function makeCode(st){
  const [v,bits] = packState(st);              // 63 Bit
  const chk = BigInt(hash(teamKey(st.team)+"|"+v.toString(36)+"|NB-spion") & 0xFFF); // 12 Bit
  let all = (v<<12n) | chk, s = "";
  for(let i=0;i<15;i++){ s = A32[Number(all & 31n)] + s; all >>= 5n; }
  return s.slice(0,5)+"-"+s.slice(5,10)+"-"+s.slice(10);
}
function readCode(team, code){
  const c = String(code).toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(c.length !== 15) return null;
  let all = 0n; for(const ch of c){ const i = A32.indexOf(ch); if(i<0) return null; all = (all<<5n) | BigInt(i); }
  const chk = all & 0xFFFn, v = all >> 12n;
  if(BigInt(hash(teamKey(team)+"|"+v.toString(36)+"|NB-spion") & 0xFFF) !== chk) return null;
  let x = v; const take = (b) => { const r = Number(x & ((1n<<BigInt(b))-1n)); x >>= BigInt(b); return r; };
  const st = fresh(); st.team = String(team).trim();
  st.quizPts = take(5); st.quizDone = !!take(1); st.transfer = !!take(1); st.extra = !!take(1); st.java.e = !!take(1);
  for(let n=6;n>=1;n--){ st.hints[n] = take(2); st.fails[n] = take(3); const m = take(4); st.steps[n] = [0,1,2,3].map(i => !!(m & (1<<i))); }
  return st;
}

/* =====================================================================
   Helfer
   ===================================================================== */
const app = document.getElementById("app");
const $ = (h) => { const d = document.createElement("div"); d.innerHTML = h.trim(); return d.firstElementChild; };
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = (s) => String(s).toUpperCase().replace(/Ä/g,"AE").replace(/Ö/g,"OE").replace(/Ü/g,"UE").replace(/ß/g,"SS").replace(/[^A-Z0-9]/g,"");
const ncode = (s) => String(s).replace(/\s+/g,"").replace(/"/g,"'");
function shakeEl(el){ el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const ABC = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
function caesar(t,k){ return t.replace(/[A-Z]/g, c => String.fromCharCode((c.charCodeAt(0)-65+k+260)%26+65)); }

function pips(){
  const p = document.getElementById("pips"); p.innerHTML = "";
  for(let n=1;n<=6;n++) p.append($(`<span class="pip ${missionDone(n)?"done":missionStarted(n)?"part":""}" title="Mission ${n}">${n}</span>`));
  const ht = document.getElementById("hTeam"); ht.textContent = S.team ? "Team " + S.team : (TEACHER ? "Lehrkraft" : "kein Team");
}
document.getElementById("home").onclick = () => home();
document.getElementById("hSave").onclick = () => report();

/* ---------- Bausteine ---------- */
// Multiple Choice: opts = [[text, richtig, warum]]
function mc(el, n, q, opts, solved, onOk){
  const box = $(`<div><p><b>${q}</b></p><div class="o"></div></div>`); el.append(box);
  const od = box.querySelector(".o");
  shuffle(opts).forEach(([t, ok, why]) => {
    const b = $(`<button class="opt">${t}</button>`);

function gapCode(el, n, parts, G, solvedFn, onOk){
  const solved = solvedFn();
  const pre = $(`<div class="code"></div>`), hb = $(`<div class="gaphints"></div>`);
  el.append(pre); const inputs = {};
  parts.forEach(p => {
    if(typeof p === "string"){ pre.append(document.createTextNode("")); pre.insertAdjacentHTML("beforeend", hl(p)); return; }
    const g = G[p.g];
    const span = $(`<span class="gap"><span class="lab">${p.g}</span><input type="text" spellcheck="false" autocomplete="off" style="width:${Math.max(3,g.w)+1}ch" placeholder="${esc(g.ph)}"><button title="Hilfe zu ${p.g}">?</button></span>`);
    const inp = span.querySelector("input"); inputs[p.g] = inp;
    if(S.ui["gap"+p.g]) inp.value = S.ui["gap"+p.g];
    if(solved){ inp.value = g.show; inp.classList.add("ok"); inp.disabled = true; }
    inp.oninput = () => { inp.classList.remove("ok","bad"); S.ui["gap"+p.g] = inp.value; save(); };
    span.querySelector("button").onclick = () => {
      const id = "gap-"+p.g; const lvl = (S.ui[id]||0); const txt = g.hints[Math.min(lvl, g.hints.length-1)];
      hintUsed(n, id+"-"+lvl); S.ui[id] = Math.min(lvl+1, g.hints.length-1); save();
      hb.prepend($(`<div class="fb info pop"><b>${p.g}:</b> ${txt}</div>`));
    };
    pre.append(span);
  });
  el.append(hb);
  const ctrl = $(`<div class="row" style="margin-top:10px"><button class="btn">Lücken prüfen</button><span class="small res"></span></div>`); el.append(ctrl);
  if(solved){ ctrl.querySelector("button").disabled = true; ctrl.querySelector(".res").textContent = "✓ alle Lücken richtig"; return; }
  ctrl.querySelector("button").onclick = () => {
    let right = 0, total = 0, anyWrong = false;
    for(const id in inputs){ total++; const inp = inputs[id], g = G[id];
      if(!inp.value.trim()){ inp.classList.add("bad"); anyWrong = true; continue; }
      if(g.ok.some(a => ncode(a) === ncode(inp.value))){ inp.classList.add("ok"); inp.classList.remove("bad"); right++; }
      else { inp.classList.add("bad"); inp.classList.remove("ok"); anyWrong = true; }
    }
    ctrl.querySelector(".res").textContent = `${right} von ${total} Lücken richtig`;
    if(anyWrong){ fail(n); shakeEl(pre); }
    else { Object.values(inputs).forEach(i => i.disabled = true); ctrl.querySelector("button").disabled = true; onOk(); }
  };
}

   {t:"Wie sicher ist ein Verfahren? Der Schlüsselraum", r(el, ok, solved){

 {n:4, name:"Das Schlüsselproblem", topic:"Vigenère · Schlüsselaustausch · Farbmisch-Experiment",

   {t:"Die Idee: ein Geheimnis vereinbaren, ohne es zu verschicken", r(el, ok, solved){

           <div class="cell">${phase>=2 ? sw(mix(G0,A),"Gelb + Anna") : ""}</div><div class="cell mid">${phase>=2 ? "⇄<br>wird verschickt" : ""}</div><div class="cell">${phase>=2 ? sw(mix(G0,B),"Gelb + Ben") : ""}</div>
           <div class="cell">${phase>=3 ? sw(mix(G0,B,A),"Bens Mischung + Anna") : ""}</div><div class="cell mid">${phase>=3 ? "gleich!" : ""}</div><div class="cell">${phase>=3 ? sw(mix(G0,A,B),"Annas Mischung + Ben") : ""}</div></div>
          ${phase>=4 ? `<div class="eve"><b>EVE</b> sieht: <span class="swatch" style="background:rgb(${G0});width:34px;height:34px"></span><span class="swatch" style="background:${mix(G0,A)};width:34px;height:34px"></span><span class="swatch" style="background:${mix(G0,B)};width:34px;height:34px"></span> → kippt beide Mischungen zusammen: <span class="swatch" style="background:${mix(G0,A,G0,B)};width:34px;height:34px"></span> <span>passt nicht!</span></div>` : ""}

        const pal = (sel, get, set) => { const p = box.querySelector(sel); if(!p) return; p.innerHTML = PAL.map((c,i)=>`<button style="background:rgb(${c})" class="${i===get()?"sel":""}" data-i="${i}" aria-label="Farbe ${i+1}"></button>`).join(""); p.querySelectorAll("button").forEach(bt => bt.onclick = () => { set(+bt.dataset.i); save(); draw(); }); };

 {n:5, name:"Echt oder gefälscht?", topic:"Schlüsselpaar · Hash und Signatur · Man-in-the-Middle · Zertifikate",
  story:`Freitag, 15:10 Uhr: Alle Lehrkräfte bekommen zwei Mails, beide angeblich von der Schulleitung. Eine davon führt zum gefälschten Portal. Wer im WLAN SCHULE GAST war, bekam beim Öffnen außerdem eine Zertifikatswarnung, und viele haben sie weggeklickt.<br><br>Prüft Mails und Zertifikate so, wie es ein Computer tut. Dafür braucht ihr ein neues Werkzeug: Schlüsselpaare.`,
  evidence:null,
  heft:"Ins Heft: Merktabelle „Wer nutzt welchen Schlüssel?“ abschreiben. Ablauf einer digitalen Signatur mit Hashwert als Skizze (Signieren und Prüfen). Die drei Schutzziele mit je einem Beispiel. Man-in-the-Middle-Angriff im WLAN SCHULE GAST als Skizze (AB 5, Aufgaben 2, 3 und 5).",
  clue:"Das gefälschte Portal nutzt ein selbst signiertes Zertifikat. Ausgestellt von: K. Brandt IT-Service.",
  steps:[
   {t:"Das Schlüsselpaar: Schloss und Schlüssel", r(el, ok, solved){
      const lock = (open, col) => `<svg width="56" height="64" viewBox="0 0 56 64"><path d="M14 30 V18 a14 14 0 0 1 28 0 ${open?"V12":"V30"}" fill="none" stroke="#2a2824" stroke-width="6" stroke-linecap="round"/><rect x="6" y="28" width="44" height="32" rx="6" fill="${col}"/><circle cx="28" cy="42" r="5" fill="#f5efe2"/><rect x="26" y="44" width="4" height="9" fill="#f5efe2"/></svg>`;
      el.append($(`<div><p>Ben hat viele <b>offene Vorhängeschlösser</b>, die er an alle verteilt. Den einzigen <b>Schlüssel</b> dazu behält er für sich.</p>
        <div class="locks"><div>${lock(true,"#1f7a84")}öffentlicher Schlüssel<br><span class="small">= Bens offenes Schloss, für alle</span></div><div><svg width="64" height="64" viewBox="0 0 64 64"><circle cx="18" cy="32" r="12" fill="none" stroke="#c43a2c" stroke-width="6"/><path d="M30 32 H58 M50 32 v10 M42 32 v8" stroke="#c43a2c" stroke-width="6" stroke-linecap="round"/></svg>privater Schlüssel<br><span class="small">= nur Ben hat ihn</span></div></div>
        <p>Jeder kann eine Kiste mit Bens Schloss zuschnappen lassen. Öffnen kann sie nur Ben. Das Besondere: Der private Schlüssel muss nie verschickt werden. In der Mathematik steckt dahinter eine <b>Einwegfunktion</b>: leicht zu berechnen, aber praktisch nicht umzukehren, wie beim Farbmischen.</p></div>`));
      const rest = $(`<div></div>`);
      mc(el, 5, "Anna will Ben eine geheime Nachricht schicken. Was benutzt sie?", [
        ["Bens öffentlichen Schlüssel (sein offenes Schloss).", true, "Richtig. Öffnen kann die Kiste nur Ben mit seinem privaten Schlüssel."],
        ["Bens privaten Schlüssel.", false, "Den hat nur Ben. Anna kommt da gar nicht dran."],
        ["Ihren eigenen öffentlichen Schlüssel.", false, "Dann könnte nur Anna die Kiste wieder öffnen, nicht Ben."]], solved || S.ui.m5a, () => { S.ui.m5a = true; save(); table(); });
      el.append(rest);
      function table(){
        rest.append($(`<p style="margin-top:16px">Bei einer <b>digitalen Signatur</b> ist es genau umgekehrt: Anna „unterschreibt“ mit ihrem privaten Schlüssel, und alle können mit ihrem öffentlichen Schlüssel prüfen, dass die Nachricht wirklich von ihr ist. Füllt die Merktabelle aus.</p>`));
        const OPT = ["Bens öffentlicher Schlüssel","Bens privater Schlüssel","Annas öffentlicher Schlüssel","Annas privater Schlüssel"];
        const R = [["Anna verschlüsselt eine Nachricht an Ben mit …","Bens öffentlicher Schlüssel"],["Ben entschlüsselt sie mit …","Bens privater Schlüssel"],["Anna signiert eine Nachricht mit …","Annas privater Schlüssel"],["Ben prüft Annas Signatur mit …","Annas öffentlicher Schlüssel"]];
        const tb = $(`<table class="mt"><tr><th>Situation</th><th style="width:45%">Schlüssel</th></tr></table>`); rest.append(tb);
        const sels = R.map(([s,a]) => { const tr = $(`<table><tr><td>${s}</td><td><select><option value="">wählen …</option>${OPT.map(o=>`<option>${o}</option>`).join("")}</select></td></tr></table>`).querySelector("tr"); tb.querySelector("tbody").append(tr); const sel = tr.querySelector("select"); if(solved){ sel.value = a; sel.disabled = true; } return [sel,a]; });
        const b = $(`<div class="row" style="margin-top:10px"><button class="btn">Prüfen</button></div>`); rest.append(b);
        hints(rest, 5, "m5s2", ["Verschlüsseln: Es soll nur der Empfänger lesen können. Signieren: Es soll nur der Absender erstellen können.","Wer etwas tut, das nur eine Person kann, braucht deren privaten Schlüssel."]);
        if(solved){ b.querySelector("button").disabled = true; return; }
        b.querySelector("button").onclick = () => { if(sels.every(([s,a]) => s.value === a)){ sels.forEach(([s])=>s.disabled=true); b.querySelector("button").disabled = true; ok(); } else { sels.forEach(([s,a]) => s.style.borderColor = s.value===a ? "var(--ok)" : "var(--red)"); fail(5); shakeEl(tb); } };
      }
      if(solved || S.ui.m5a) table();
   }},
   {t:"Hashwert und Signatur: der digitale Fingerabdruck", r(el, ok, solved){
      const ORIG = "Liebe Kolleginnen und Kollegen, die Zeugniskonferenzen beginnen am 15.12. um 14 Uhr.";
      const fp = (t) => { const h = hash(t).toString(16).toUpperCase().padStart(8,"0"); return h.slice(0,4) + " " + h.slice(4); };
      el.append($(`<p>Eine ganze Mail mit dem privaten Schlüssel zu bearbeiten, wäre zu langsam. Darum signiert man nur ihren <b>Hashwert</b>: einen kurzen „Fingerabdruck“ fester Länge, den ein Programm aus dem Text berechnet. Ändert im Text unten etwas, zum Beispiel das Datum, und beobachtet die Prüfung.</p>`));
      const demo = $(`<div class="grid2">
        <div class="mail"><div class="hd">Von: schulleitung@schule-intern.de<br>Betreff: Zeugniskonferenzen</div><textarea rows="4" spellcheck="false" aria-label="Text der Mail"></textarea>
          <div class="small" style="margin-top:6px">🔏 Signatur: <span class="mono">${fp(ORIG)}</span>, verschlüsselt mit dem <b>privaten</b> Schlüssel der Schulleitung</div></div>
        <div><p style="margin-top:0"><b>Die Lehrkraft prüft:</b></p>
          <table class="mt"><tr><td>① Signatur mit dem <b>öffentlichen</b> Schlüssel der Schulleitung entschlüsseln</td><td class="mono"><b>${fp(ORIG)}</b></td></tr>
          <tr><td>② Hashwert der angekommenen Mail selbst berechnen</td><td class="mono"><b class="now"></b></td></tr></table><div class="res"></div></div></div>`); el.append(demo);
      const ta = demo.querySelector("textarea"); ta.value = ORIG;
      const upd = () => { const h = fp(ta.value); demo.querySelector(".now").textContent = h;
        demo.querySelector(".res").innerHTML = h === fp(ORIG) ? `<div class="fb ok">✓ Beide Werte gleich: Die Mail ist unverändert und stammt von der Schulleitung.</div>` : `<div class="fb err">✗ Die Werte passen nicht: Die Mail wurde unterwegs verändert.</div>`; };
      ta.oninput = upd; upd();
      el.append($(`<p class="small">Das Camp rechnet mit einem Spielzeug-Hash aus 32 Bit. Echte Verfahren wie SHA-256 liefern 256 Bit. Eine <b>Hashfunktion</b> ist eine Einwegfunktion: Aus dem Hashwert kann man den Text nicht zurückrechnen, und schon ein geändertes Zeichen ergibt einen völlig anderen Wert.</p>`));
      const rest = $(`<div></div>`);
      mc(el, 5, "Ein Angreifer ändert in der signierten Mail nur das Datum. Warum fällt das auf?", [
        ["Der selbst berechnete Hashwert passt nicht mehr zum Hashwert aus der Signatur.", true, ""],
        ["Die Mail lässt sich nicht mehr öffnen.", false, "Lesen kann man sie weiterhin. Nur die Prüfung schlägt fehl."],
        ["Gar nicht, solange er die alte Signatur mitschickt.", false, "Die alte Signatur passt nur zum alten Text. Eine neue kann er ohne den privaten Schlüssel der Schulleitung nicht erstellen."]], solved || S.ui.m5b, () => { S.ui.m5b = true; save(); more(); });
      el.append(rest);
      function more(){
        rest.append($(`<p style="margin-top:16px">Für Sicherheit gibt es drei Fachbegriffe, die <b>Schutzziele</b>. <b>Vertraulichkeit:</b> Nur Befugte können die Nachricht lesen. <b>Integrität:</b> Die Nachricht wurde nicht verändert. <b>Authentizität:</b> Die Nachricht stammt wirklich vom angegebenen Absender.</p>`));
        mc(rest, 5, "Welche Schutzziele sichert eine digitale Signatur?", [
          ["Integrität und Authentizität", true, "Genau. Der Hashwert zeigt jede Änderung (Integrität), und nur der Besitzer des privaten Schlüssels kann die Signatur erstellen (Authentizität)."],
          ["Vertraulichkeit und Integrität", false, "Eine signierte Mail ist nicht verschlüsselt. Jeder kann sie lesen. Für Vertraulichkeit muss man zusätzlich verschlüsseln."],
          ["nur Vertraulichkeit", false, "Signieren heißt nicht verschlüsseln. Die Mail bleibt lesbar."]], solved, ok);
      }
      if(solved || S.ui.m5b) more();
   }},
   {t:"Die Mails prüfen", r(el, ok, solved){
      el.append($(`<div class="grid2">
        <div class="mail"><div class="hd">Von: schulleitung@schule-intern.de · Fr 15:10<br>Betreff: Termine Dezember</div>Liebe Kolleginnen und Kollegen, anbei die Termine für Dezember. Die Zeugniskonferenzen beginnen am 15.12.<br><span class="small">🔏 digital signiert</span><div class="o1"></div></div>
        <div class="mail"><div class="hd">Von: schulleitung@schule-intern.de · Fr 15:12<br>Betreff: DRINGEND: neues Notenportal</div>Liebe Kolleginnen und Kollegen, wegen der Störung muss jede Lehrkraft ihr Passwort im neuen Portal bestätigen: notenportal-schule-intern.de<br><span class="small">🔏 digital signiert</span><div class="o2"></div></div></div>`));
      const showRes = () => { el.querySelector(".o1").innerHTML = `<div class="fb ok">✓ Signatur gültig: Die Hashwerte stimmen überein. Von der Schulleitung, unverändert.</div>`; el.querySelector(".o2").innerHTML = `<div class="fb err">✗ Signatur ungültig: Mit dem öffentlichen Schlüssel der Schulleitung ergibt sie nicht den Hashwert dieser Mail. Fälschung!</div>`; };
      if(solved) showRes();
      mc(el, 5, "Mit welchem Schlüssel prüft ihr die Signaturen?", [
        ["mit dem öffentlichen Schlüssel der Schulleitung", true, ""],
        ["mit dem privaten Schlüssel der Schulleitung", false, "Den hat nur die Schulleitung. Mit ihm wird signiert, nicht geprüft."],
        ["mit dem öffentlichen Schlüssel der Lehrkräfte", false, "Damit verschlüsselt man Nachrichten an die Lehrkräfte. Für die Signatur der Schulleitung hilft er nicht."]], solved, () => { showRes(); ok(); });
   }},
   {t:"Die Zertifikate vergleichen", r(el, ok, solved){
      el.append($(`<p>Der Trick der Täter: Im WLAN SCHULE GAST saßen sie <b>zwischen</b> den Lehrkräften und dem Internet (Man-in-the-Middle). Sie schickten ihren eigenen öffentlichen Schlüssel und taten so, als wären sie das Notenportal. Nur das Zertifikat verrät sie.</p>
        <div class="grid2">
         <div class="certbox"><b>Portal A</b> (WLAN der Schule)<table><tr><td>Ausgestellt für</td><td>notenportal.schule-intern.de</td></tr><tr><td>Ausgestellt von</td><td>Zertifizierungsstelle (im Browser hinterlegt)</td></tr><tr><td>Öffentlicher Schlüssel</td><td class="mono">…8F3A 21C7…</td></tr><tr><td>Browser</td><td>🔒 Verbindung ist sicher</td></tr></table></div>
         <div class="certbox"><b>Portal B</b> (WLAN SCHULE GAST)<table><tr><td>Ausgestellt für</td><td>notenportal-schule-intern.de</td></tr><tr><td>Ausgestellt von</td><td>K. Brandt IT-Service</td></tr><tr><td>Öffentlicher Schlüssel</td><td class="mono">…04BE 9D12…</td></tr><tr><td>Browser</td><td>⚠ Zertifikat nicht vertrauenswürdig (selbst signiert)</td></tr></table></div></div>`));
      const rest = $(`<div></div>`);
      mc(el, 5, "Was verrät Portal B?", [
        ["Der Absender hat sein Zertifikat selbst unterschrieben. Niemand bestätigt, dass der öffentliche Schlüssel zum echten Notenportal gehört.", true, "Ein Zertifikat ist nur vertrauenswürdig, wenn eine Zertifizierungsstelle es unterschreibt, die der Browser kennt."],
        ["Portal B ist sicher, weil die Verbindung verschlüsselt ist.", false, "Verschlüsselt ja, aber mit dem Schlüssel der Täter. Sie können alles lesen."],
        ["Portal B ist echt, weil die Adresse fast gleich aussieht.", false, "Schaut genau hin: Bindestrich statt Punkt. Eine andere Adresse."]], solved || S.ui.m5d, () => { S.ui.m5d = true; save(); more(); });
      el.append(rest);
      function more(){ ask(rest, 5, "Wer hat das gefälschte Zertifikat ausgestellt? (Feld „Ausgestellt von“)", a => norm(a).includes("BRANDT"), solved, ok, "Name"); }
      if(solved || S.ui.m5d) more();
   }}
  ]},
 {n:6, name:"Finale: Wer war es?", topic:"Angriff rekonstruieren · Täter · HTTPS · Sicherheitskonzept",
  story:`Alle Spuren liegen auf dem Tisch. Jetzt rekonstruiert ihr den Angriff, überführt den Täter und entwickelt für die Schulleitung ein Sicherheitskonzept: <b>Wie macht die Schule es künftig besser?</b>`,
  evidence:`<span class="sys">[Besucherliste Sekretariat] Freitag</span>\n 9:00-12:00  Fortbildung: Referentin Dr. S. Lenz (Lehrerzimmer)\n10:15-11:00  PrintPro, Wartung Kopierer (Raum 104)\n<span class="hot">14:30-15:20  K. Brandt IT-Service, "Abholung Altgeräte" (Lehrerzimmer)</span>\n<span class="sys">Hinweis Schulträger: Vertrag mit K. Brandt IT-Service endete im Juli. Keine Abholung beauftragt.</span>`,
  heft:"Abgabe: Sicherheitskonzept für die Schulleitung als Plakat oder im Heft. Zu jeder Maßnahme: Welchen Schritt hätte sie verhindert, welches Verfahren steckt dahinter, welches Schutzziel sichert sie? Danach füllt ihr den Abi-Spickzettel Kryptografie aus (AB 6, Aufgaben 1, 2 und 4).",
  clue:"Täter überführt: K. Brandt IT-Service, der ehemalige externe Dienstleister der Schule.",
  steps:[
   {t:"Den Angriff rekonstruieren", r(el, ok, solved){
      el.append($(`<p>Klickt die Schritte des Angriffs in der richtigen Reihenfolge an.</p>`));
      let pos = 0; const box = $(`<div></div>`); el.append(box);
      shuffle(ATTACK.map((s,i)=>[s,i])).forEach(([s,i]) => { const b = $(`<button class="opt"><b class="nr" style="color:var(--petrol);margin-right:8px"></b>${s}</button>`);
        if(solved){ b.classList.add("good"); b.querySelector(".nr").textContent = (i+1)+"."; b.style.order = i; }
        b.onclick = () => { if(solved || b.classList.contains("good")) return;
          if(i===pos){ b.classList.add("good"); b.querySelector(".nr").textContent = (pos+1)+"."; pos++; if(pos===ATTACK.length){ solved = true; ok(); } }
          else { fail(6); shakeEl(b); } };
        box.append(b); });
      if(solved){ box.style.display = "flex"; box.style.flexDirection = "column"; }
   }},
   {t:"Wer war es?", r(el, ok, solved){
      const SUS = [["Dr. S. Lenz, Referentin der Fortbildung","Sie war nur bis 12 Uhr im Lehrerzimmer. Das falsche WLAN und die Mails kamen erst am Nachmittag."],
                   ["PrintPro, Wartung des Kopierers","Der Techniker war nur in Raum 104, nicht im Lehrerzimmer."],
                   ["K. Brandt IT-Service, ehemaliger IT-Dienstleister",""],
                   ["Unbekannter Nachbar mit offenem WLAN","Das WLAN SCHULE GAST stand im Lehrerzimmer, nicht draußen."]];
      mc(el, 6, "Wer steckt hinter dem Angriff? Nutzt die Besucherliste und eure Ermittlungsnotizen.", SUS.map(([t,w]) => [t, !w, w || "Überführt: Das gefälschte Zertifikat trägt den Namen K. Brandt IT-Service. Laut Besucherliste war die Firma am Freitag von 14:30 bis 15:20 Uhr ohne Auftrag im Lehrerzimmer, genau als SCHULE GAST auftauchte und die Mails kamen."]), solved, ok);
   }},
   {t:"Wie macht die Schule es besser?", r(el, ok, solved){
      el.append($(`<p>Ordnet jedem Schritt des Angriffs die Maßnahme zu, die ihn gestoppt hätte. Zwei Maßnahmen helfen gar nicht.</p>`));
      const tb = $(`<table class="mt"><tr><th>Schritt des Angriffs</th><th style="width:52%">Maßnahme</th></tr></table>`); el.append(tb);
      const opts = shuffle(MEASURES.concat(DISTRACT));
      const sels = ATTACK.map((a,i) => { const tr = $(`<table><tr><td><b>${i+1}.</b> ${a}</td><td><select><option value="">wählen …</option>${opts.map(o=>`<option>${o}</option>`).join("")}</select></td></tr></table>`).querySelector("tr"); tb.querySelector("tbody").append(tr); const s = tr.querySelector("select"); if(solved){ s.value = MEASURES[i]; s.disabled = true; } return s; });
      const b = $(`<div class="row" style="margin-top:10px"><button class="btn">Prüfen</button><span class="small res"></span></div>`); el.append(b);
      if(solved){ b.querySelector("button").disabled = true; return; }
      b.querySelector("button").onclick = () => { let r = 0; sels.forEach((s,i) => { const good = s.value === MEASURES[i]; if(good) r++; s.style.borderColor = good ? "var(--ok)" : "var(--red)"; });
        b.querySelector(".res").textContent = `${r} von ${ATTACK.length} richtig`;
        if(r === ATTACK.length){ sels.forEach(s=>s.disabled=true); b.querySelector("button").disabled = true; ok(); } else { fail(6); shakeEl(tb); } };
      hints(el, 6, "m6s3", ["Die beiden Maßnahmen, die nichts nützen, haben mit Caesar und mit dem Abschalten zu tun.","Signaturen helfen gegen gefälschte Mails, Zertifikate gegen gefälschte Seiten."]);
   }},
   {t:"Schutzziele und das Schloss im Browser", r(el, ok, solved){
      el.append($(`<p>Für den Bericht an die Schulleitung ordnet ihr jede Maßnahme dem <b>Schutzziel</b> zu, das sie sichert.</p>`));
      const SZ = ["Vertraulichkeit","Integrität","Authentizität"];
      const R = [["HTTPS verschlüsselt die Verbindung zum Notenportal. Im WLAN kann niemand die Passwörter mitlesen.","Vertraulichkeit"],
                 ["Der Hashwert in der Signatur zeigt: Die Mail der Schulleitung wurde unterwegs nicht verändert.","Integrität"],
                 ["Das Zertifikat einer Zertifizierungsstelle bestätigt: Der öffentliche Schlüssel gehört wirklich zum Notenportal.","Authentizität"],
                 ["Nachts vergleicht ein Programm die Hashwerte der Notendateien mit gespeicherten Werten.","Integrität"],
                 ["Die Signatur kann nur mit dem privaten Schlüssel der Schulleitung erstellt werden.","Authentizität"]];
      const tb = $(`<table class="mt"><tr><th>Maßnahme</th><th style="width:34%">Schutzziel</th></tr></table>`); el.append(tb);
      const sels = R.map(([s,a]) => { const tr = $(`<table><tr><td>${s}</td><td><select><option value="">wählen …</option>${SZ.map(o=>`<option>${o}</option>`).join("")}</select></td></tr></table>`).querySelector("tr"); tb.querySelector("tbody").append(tr); const sel = tr.querySelector("select"); if(solved || S.ui.m6s){ sel.value = a; sel.disabled = true; } return [sel,a]; });
      const b = $(`<div class="row" style="margin-top:10px"><button class="btn">Prüfen</button><span class="small res"></span></div>`); el.append(b);
      hints(el, 6, "m6s4", ["Vertraulichkeit: Wer kann mitlesen? Integrität: Wurde etwas verändert? Authentizität: Wer ist der Absender oder Inhaber?"]);
      const rest = $(`<div></div>`); el.append(rest);
      if(solved || S.ui.m6s) b.querySelector("button").disabled = true;

    <tr><td colspan="4"><b>Gesamt</b></td><td><b style="font-size:20px">${totalPts()} / ${MAXPTS}</b></td></tr></table>

    <p class="small">📷 Fotografiert diese Seite und schickt das Foto eurer Lehrkraft. Mit Teamname und Code könnt ihr beim nächsten Mal genau hier weitermachen, auch an einem anderen Rechner: Startseite → „Weitermachen mit Stand-Code“.</p>
    <div class="row"><button class="btn ghost">◀ Zurück zur Fallakte</button></div></div>`);
  r.querySelector("button").onclick = home; app.append(r);
}

/* ---------- Lehrkraft ---------- */
const TKEY = KEY + "-klasse";
function tload(){ try{ return JSON.parse(localStorage.getItem(TKEY)||"[]"); }catch(e){ return []; } }
function tsave(a){ try{ localStorage.setItem(TKEY, JSON.stringify(a)); }catch(e){} }
function teacherPanel(){
  const p = $(`<div class="dark"><span class="tag">Lehrkraft</span><h2>Klassenübersicht</h2>
    <p class="small" style="color:#cfdcda">Im Lehrermodus sind alle Missionen und Schritte offen. Tragt hier Teamname und Stand-Code von den Fotos ein. Ein falscher Code wird abgelehnt, also lässt sich kein Stand fälschen. Die Liste bleibt in diesem Browser gespeichert. Ein neuerer Code desselben Teams ersetzt den alten.</p>
    <div class="row"><input type="text" class="tn" placeholder="Teamname" style="max-width:200px"><input type="text" class="tc" placeholder="XXXXX-XXXXX-XXXXX" style="max-width:240px"><button class="btn amber small ta">Hinzufügen</button><span class="msg small"></span></div>
    <div class="tt" style="margin-top:14px"></div>
    <div class="row" style="margin-top:12px"><button class="btn ghost small csv">Als CSV herunterladen</button><button class="btn ghost small clr">Liste leeren</button></div></div>`);
  app.append(p);
  const draw = () => {
    const L = tload();
    if(!L.length){ p.querySelector(".tt").innerHTML = `<p class="small" style="color:#7f9a97">Noch keine Teams eingetragen.</p>`; return; }
    const head = `<tr><th>Team</th>${M.map(m=>`<th title="${m.name}">M${m.n}</th>`).join("")}<th>Java E</th><th>Vigenère</th><th>Quiz</th><th>Gesamt</th><th>Stand vom</th><th></th></tr>`;
    const body = L.map((e,ix) => { const st = readCode(e.team, e.code); if(!st) return ""; const old = S; S = st;
      const cells = M.map(m => { const k = (st.steps[m.n]||[]).filter(Boolean).length; const done = missionDone(m.n);
        return `<td title="${st.fails[m.n]} Fehlversuche, ${st.hints[m.n]} Hilfen">${done?`<b style="color:#8fe3a8">${missionPts(m.n)}</b>`:k?`<span style="color:var(--amber)">${k}/${NSTEPS[m.n-1]}</span>`:"–"}<br><span style="font-size:11px;color:#7f9a97">F${st.fails[m.n]} H${st.hints[m.n]}</span></td>`; }).join("");
      const row = `<tr><td>${esc(e.team)}</td>${cells}<td>${st.java.e?"✓":"–"}</td><td>${st.transfer?"✓":"–"}</td><td>${st.quizDone?st.quizPts:"–"}</td><td><b>${totalPts()}</b></td><td style="font-size:12px">${e.t}</td><td><button class="btn ghost small del" data-i="${ix}">✕</button></td></tr>`;
      S = old; return row; }).join("");
    p.querySelector(".tt").innerHTML = `<table>${head}${body}</table><p class="small" style="color:#7f9a97">M1 bis M6: Punkte der gelösten Mission (grün) oder gelöste Schritte (gelb). F = Fehlversuche, H = genutzte Hilfen.</p>`;
    p.querySelectorAll(".del").forEach(b => b.onclick = () => { const L = tload(); L.splice(+b.dataset.i,1); tsave(L); draw(); });
  };
  p.querySelector(".ta").onclick = () => {
    const team = p.querySelector(".tn").value.trim(), code = p.querySelector(".tc").value.trim(), msg = p.querySelector(".msg");
    if(!readCode(team, code)){ msg.textContent = "Code passt nicht zum Teamnamen."; msg.style.color = "#ff9d8a"; return; }
    const L = tload().filter(e => teamKey(e.team) !== teamKey(team)); L.push({team, code, t: new Date().toLocaleString("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})});
    L.sort((a,b) => a.team.localeCompare(b.team)); tsave(L); msg.textContent = "✓ eingetragen"; msg.style.color = "#8fe3a8"; p.querySelector(".tn").value = ""; p.querySelector(".tc").value = ""; draw();
  };
  p.querySelector(".csv").onclick = () => {
    const L = tload(); let csv = "Team;" + M.map(m=>`M${m.n} Punkte;M${m.n} Schritte;M${m.n} Fehlversuche;M${m.n} Hilfen`).join(";") + ";Java Experte;Expertenspur;Vigenere Transfer;Quiz;Gesamt;Code;Stand vom\n";
    const old = S;
    L.forEach(e => { const st = readCode(e.team, e.code); if(!st) return; S = st;
      csv += `${e.team};` + M.map(m => `${missionPts(m.n)};${(st.steps[m.n]||[]).filter(Boolean).length};${st.fails[m.n]};${st.hints[m.n]}`).join(";") + `;${st.java.e?1:0};${st.extra?1:0};${st.transfer?1:0};${st.quizDone?st.quizPts:""};${totalPts()};${e.code};${e.t}\n`; });
    S = old;
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv"})); a.download = "spioncamp_klassenuebersicht.csv"; a.click();
  };
  p.querySelector(".clr").onclick = () => { if(p.querySelector(".clr").dataset.c){ tsave([]); draw(); p.querySelector(".clr").textContent = "Liste leeren"; delete p.querySelector(".clr").dataset.c; } else { p.querySelector(".clr").dataset.c = 1; p.querySelector(".clr").textContent = "Wirklich leeren? Nochmal klicken"; } };
  draw();
}

/* =====================================================================
   Start
   ===================================================================== */
home();
</script>
</body>
</html>
